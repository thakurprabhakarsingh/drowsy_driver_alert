<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Driver Guard Web</title>
  <!-- MediaPipe CDN scripts for real in-browser face & eye tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0A0E17;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      transition: background-color 0.2s;
    }
    .device-container {
      width: 100%;
      max-width: 420px;
      background: #0F1523;
      border-radius: 28px;
      border: 3px solid #1E293B;
      padding: 20px 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      position: relative;
      transition: border-color 0.3s;
    }
    .danger-border {
      border-color: #EF4444 !important;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.45) !important;
    }
    /* Silent background video element */
    #webcam {
      display: none;
    }
    .top-badge {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    .status-pill {
      background: #131B2A;
      border: 1px solid rgba(0, 229, 255, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #CBD5E1;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #00FF88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00FF88;
    }
    .gauge-wrapper {
      position: relative;
      width: 250px;
      height: 180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #gaugeCanvas {
      width: 250px;
      height: 180px;
    }
    .gauge-value {
      position: absolute;
      bottom: 14px;
      text-align: center;
    }
    .gauge-value h2 {
      font-size: 34px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 1px;
    }
    .gauge-value span {
      font-size: 12px;
      color: #94A3B8;
    }
    .card-box {
      background: #131B2A;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 14px;
    }
    .card-title {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="number"] {
      flex: 1;
      background: #0A0E17;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      color: #FFF;
      font-size: 16px;
      outline: none;
    }
    button.btn-submit {
      background: #00E5FF;
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .alert-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid #EF4444;
      color: #EF4444;
      padding: 10px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .vehicle-section {
      background: #131B2A;
      border-radius: 16px;
      border: 1px solid rgba(0, 229, 255, 0.25);
      padding: 12px;
      margin-top: 14px;
      position: relative;
    }
    .vehicle-label {
      font-size: 11px;
      font-weight: 700;
      color: #00FF88;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    #carCanvas {
      width: 100%;
      height: 90px;
      display: block;
    }
    .lock-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid #EF4444;
      padding: 6px 14px;
      border-radius: 8px;
      color: #EF4444;
      font-size: 12px;
      font-weight: 700;
    }
    .footer-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
    }
    .start-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 14, 23, 0.95);
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Hidden camera element for background ML -->
  <video id="webcam" playsinline></video>

  <div class="device-container" id="deviceCard">
    <!-- Overlay for User Permission to enable Web Audio & Camera -->
    <div class="start-overlay" id="startOverlay">
      <h3>Smart Driver Guard</h3>
      <p style="font-size: 13px; color:#94A3B8;">Webcam access is required for real-time drowsiness monitoring.</p>
      <button class="btn-submit" style="padding: 12px 24px;" onclick="startApp()">Start System</button>
    </div>

    <!-- 1. Background Camera Status -->
    <div class="top-badge">
      <div class="status-pill">
        <div class="dot" id="camDot"></div>
        <span id="camStatusText">Face Detecting... (Active)</span>
      </div>
    </div>

    <!-- 2. Circular BAC Gauge Meter -->
    <div class="gauge-wrapper">
      <canvas id="gaugeCanvas" width="250" height="180"></canvas>
      <div class="gauge-value">
        <h2 id="gaugeValText">0.0</h2>
        <span id="gaugeUnitText">mg/100ml</span>
      </div>
    </div>

    <!-- 3. Manual BAC Input -->
    <div class="card-box">
      <div class="card-title">Enter Police Alcohol Reading (BAC)</div>
      <div class="input-row">
        <input type="number" id="bacInput" placeholder="0" step="0.1" />
        <button class="btn-submit" onclick="submitBac()">Submit & Test</button>
      </div>
    </div>

    <!-- 4. Warning Alert Banner -->
    <div class="alert-banner" id="alertBanner">
      ⚠ DANGER: VEHICLE LOCKED
    </div>

    <!-- 5. Animated Car / Track Section -->
    <div class="vehicle-section" id="vehicleBox">
      <div class="vehicle-label" id="vehicleLabel">VEHICLE STATUS: ENGINE RUNNING (Driving Safe)</div>
      <canvas id="carCanvas" width="380" height="90"></canvas>
      <div class="lock-overlay" id="lockBadge">🔒 STOP / LOCKED</div>
    </div>

    <!-- 6. Alertness Bottom Score -->
    <div class="footer-bar">
      <span>👁 Driver Alertness:</span>
      <span id="alertnessPercent" style="color: #00E5FF;">100%</span>
    </div>
  </div>

  <script>
    let currentBac = 0.0;
    let isLocked = false;
    let isDrowsy = false;
    let eyesClosedStartTime = null;

    // Web Audio Synthesizer for high-pitch continuous beep
    let audioCtx = null;
    let beepInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeepSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz alert tone
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function startBeeping() {
      if (beepInterval) return;
      playBeepSound();
      beepInterval = setInterval(playBeepSound, 320);
    }

    function stopBeeping() {
      if (beepInterval) {
        clearInterval(beepInterval);
        beepInterval = null;
      }
    }

    function speakAlert(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    // ---------------- Drawing Gauge Canvas ----------------
    const gaugeCanvas = document.getElementById("gaugeCanvas");
    const gCtx = gaugeCanvas.getContext("2d");

    function drawGauge(val) {
      gCtx.clearRect(0, 0, gaugeCanvas.width, gaugeCanvas.height);
      const cx = 125, cy = 130, r = 90;
      const startAngle = Math.PI * 0.75;
      const totalAngle = Math.PI * 1.5;

      // Track Background
      gCtx.beginPath();
      gCtx.arc(cx, cy, r, startAngle, startAngle + totalAngle);
      gCtx.lineWidth = 14;
      gCtx.strokeStyle = "rgba(255,255,255,0.08)";
      gCtx.lineCap = "round";
      gCtx.stroke();

      // Safe Zone Arc (Green)
      gCtx.beginPath();
      gCtx.arc(cx, cy, r, startAngle, startAngle + totalAngle * 0.55);
      gCtx.strokeStyle = "#00FF88";
      gCtx.stroke();

      // Danger Zone Arc (Red)
      gCtx.beginPath();
      gCtx.arc(cx, cy, r, startAngle + totalAngle * 0.65, startAngle + totalAngle);
      gCtx.strokeStyle = "#EF4444";
      gCtx.stroke();

      // Needle
      let normalized = Math.min(Math.max(val / 60.0, 0), 1);
      let angle = startAngle + (totalAngle * normalized);

      gCtx.beginPath();
      gCtx.moveTo(cx, cy);
      gCtx.lineTo(cx + (r - 18) * Math.cos(angle), cy + (r - 18) * Math.sin(angle));
      gCtx.lineWidth = 4;
      gCtx.strokeStyle = (isLocked || isDrowsy) ? "#EF4444" : "#00E5FF";
      gCtx.stroke();

      // Center pivot
      gCtx.beginPath();
      gCtx.arc(cx, cy, 7, 0, Math.PI * 2);
      gCtx.fillStyle = (isLocked || isDrowsy) ? "#EF4444" : "#00E5FF";
      gCtx.fill();
    }

    // ---------------- Animated Car Canvas ----------------
    const carCanvas = document.getElementById("carCanvas");
    const cCtx = carCanvas.getContext("2d");
    let dashOffset = 0;

    function renderCarScene() {
      cCtx.clearRect(0, 0, carCanvas.width, carCanvas.height);
      const roadY = 68;

      // Road base
      cCtx.beginPath();
      cCtx.moveTo(0, roadY);
      cCtx.lineTo(carCanvas.width, roadY);
      cCtx.lineWidth = 4;
      cCtx.strokeStyle = "#232D42";
      cCtx.stroke();

      // Road dashed line
      if (!isLocked && !isDrowsy) {
        dashOffset = (dashOffset + 5) % 40;
      }
      cCtx.lineWidth = 2.5;
      cCtx.strokeStyle = (isLocked || isDrowsy) ? "rgba(255,255,255,0.15)" : "rgba(0,229,255,0.6)";
      cCtx.beginPath();
      cCtx.setLineDash([20, 20]);
      cCtx.lineDashOffset = -dashOffset;
      cCtx.moveTo(0, roadY + 8);
      cCtx.lineTo(carCanvas.width, roadY + 8);
      cCtx.stroke();
      cCtx.setLineDash([]); // reset

      // Draw Vector Car
      const cx = carCanvas.width / 2;
      const cy = roadY - 14;

      // Car body
      cCtx.fillStyle = (isLocked || isDrowsy) ? "#64748B" : "#29B6F6";
      cCtx.beginPath();
      cCtx.moveTo(cx - 50, cy + 10);
      cCtx.lineTo(cx + 50, cy + 10);
      cCtx.lineTo(cx + 45, cy + 2);
      cCtx.lineTo(cx + 32, cy - 2);
      cCtx.lineTo(cx + 14, cy - 16);
      cCtx.lineTo(cx - 20, cy - 16);
      cCtx.lineTo(cx - 38, cy - 2);
      cCtx.lineTo(cx - 50, cy + 2);
      cCtx.closePath();
      cCtx.fill();

      // Cabin Glass
      cCtx.fillStyle = "#0F172A";
      cCtx.beginPath();
      cCtx.moveTo(cx - 18, cy - 14);
      cCtx.lineTo(cx + 11, cy - 14);
      cCtx.lineTo(cx + 27, cy - 2);
      cCtx.lineTo(cx - 34, cy - 2);
      cCtx.closePath();
      cCtx.fill();

      // Wheels
      function drawWheel(wx) {
        cCtx.beginPath();
        cCtx.arc(wx, cy + 12, 9, 0, Math.PI * 2);
        cCtx.fillStyle = "#0A0E17";
        cCtx.fill();
        cCtx.lineWidth = 2;
        cCtx.strokeStyle = (isLocked || isDrowsy) ? "#94A3B8" : "#00E5FF";
        cCtx.stroke();
      }
      drawWheel(cx - 30);
      drawWheel(cx + 30);

      requestAnimationFrame(renderCarScene);
    }

    // ---------------- BAC Input Handler ----------------
    function submitBac() {
      const val = parseFloat(document.getElementById("bacInput").value) || 0;
      currentBac = val;
      document.getElementById("gaugeValText").innerText = val.toFixed(1);

      if (val >= 30.0) {
        isLocked = true;
        updateAlertUI(true, "⚠ YOU DRANK SO VEHICLE WILL NOT START!");
        speakAlert("You drank so vehicle will not start!");
        startBeeping();
      } else {
        isLocked = false;
        if (!isDrowsy) {
          updateAlertUI(false, "");
          stopBeeping();
        }
      }
      drawGauge(val);
    }

    function updateAlertUI(active, text) {
      const card = document.getElementById("deviceCard");
      const banner = document.getElementById("alertBanner");
      const lockBadge = document.getElementById("lockBadge");
      const vLabel = document.getElementById("vehicleLabel");

      if (active) {
        card.classList.add("danger-border");
        banner.style.display = "block";
        banner.innerText = text;
        lockBadge.style.display = "block";
        vLabel.innerText = "ENGINE STATUS: LOCKED / STOPPED";
        vLabel.style.color = "#EF4444";
      } else {
        card.classList.remove("danger-border");
        banner.style.display = "none";
        lockBadge.style.display = "none";
        vLabel.innerText = "VEHICLE STATUS: ENGINE RUNNING (Driving Safe)";
        vLabel.style.color = "#00FF88";
      }
    }

    // ---------------- MediaPipe Drowsiness Logic ----------------
    function computeEAR(eyeLandmarks, p1, p2, p3, p4, p5, p6) {
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const vertical = dist(eyeLandmarks[p2], eyeLandmarks[p6]) + dist(eyeLandmarks[p3], eyeLandmarks[p5]);
      const horizontal = 2.0 * dist(eyeLandmarks[p1], eyeLandmarks[p4]);
      return vertical / horizontal;
    }

    function onFaceMeshResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;

      const landmarks = results.multiFaceLandmarks[0];
      // Eye landmark indices for MediaPipe
      const leftEAR = computeEAR(landmarks, 33, 160, 158, 133, 153, 144);
      const rightEAR = computeEAR(landmarks, 362, 385, 387, 263, 373, 380);
      const avgEAR = (leftEAR + rightEAR) / 2.0;

      const alertness = Math.min(Math.max((avgEAR / 0.32) * 100, 0), 100).toFixed(0);
      document.getElementById("alertnessPercent").innerText = `${alertness}%`;

      // Closed eye threshold (~0.20)
      if (avgEAR < 0.20) {
        if (!eyesClosedStartTime) {
          eyesClosedStartTime = Date.now();
        }
        const durationSec = (Date.now() - eyesClosedStartTime) / 1000;

        if (durationSec >= 5.0 && !isDrowsy) {
          isDrowsy = true;
          document.getElementById("gaugeValText").innerText = "DROWSY";
          updateAlertUI(true, "⚠ EXTREME DROWSINESS DETECTED! WAKE UP!");
          speakAlert("Extreme drowsiness alert! Driver is sleeping! Wake up!");
          startBeeping();
        }
      } else {
        eyesClosedStartTime = null;
        if (isDrowsy) {
          isDrowsy = false;
          document.getElementById("gaugeValText").innerText = currentBac.toFixed(1);
          if (!isLocked) {
            updateAlertUI(false, "");
            stopBeeping();
          }
        }
      }
    }

    // ---------------- App Initializer ----------------
    async function startApp() {
      initAudio();
      document.getElementById("startOverlay").style.display = "none";

      drawGauge(0.0);
      renderCarScene();

      const videoElement = document.getElementById("webcam");
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      faceMesh.onResults(onFaceMeshResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 480,
        height: 360
      });

      camera.start();
    }
  </script>
</body>
</html>
